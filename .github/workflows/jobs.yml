name: Jobs diários

# Jobs agendados do documento 02, §8.4. Rodam como scripts ligados direto no banco: não há endpoint
# exposto, e funcionam mesmo com o servidor hibernando.
on:
  schedule:
    - cron: '17 6 * * *' # todo dia, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Só roda onde foi ligado de propósito (variável do repositório), nunca em forks
    if: ${{ vars.JOBS_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # cleanup, purge-accounts, strikes, retention e coming-of-age
      - run: pnpm jobs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
