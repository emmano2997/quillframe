version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # react e react-dom precisam da mesma versão exata: sobem sempre juntos
      react:
        patterns:
          - react
          - react-dom
      # O cliente e a CLI do Prisma também andam juntos
      prisma:
        patterns:
          - prisma
          - '@prisma/*'
      dev-tools:
        dependency-type: development
    ignore:
      # TypeScript 7 só quando o typescript-eslint suportar (hoje ele recusa rodar)
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Os tipos do Node acompanham a versão do runtime (.node-version), não a última
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
